name: Correctness evidence
description: Track a reproducible ecosystem correctness defect from observation through upstream disposition.
title: "[library/subsystem] "
body:
  - type: markdown
    attributes:
      value: |
        Open one issue per independently actionable root cause. Do not combine unrelated symptoms merely because one commit happens to fix them.

  - type: dropdown
    id: status
    attributes:
      label: Evidence status
      options:
        - Observed
        - Modeled
        - Fixed on fork
        - Upstream candidate
        - Upstreamed
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owning repository and exact revision
      description: Repository plus the full affected commit SHA or released version.
      placeholder: owner/repo@0123456789abcdef...
    validations:
      required: true

  - type: textarea
    id: defect
    attributes:
      label: Observable defect
      description: State the violated safety, liveness, compatibility, or resource-ownership contract and its user-visible failure.
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer and evidence
      description: Include the smallest executable reproducer, property seed, history, trace, native observer, or bounded proof witness. Record timeouts as failures, not assumptions.
    validations:
      required: true

  - type: textarea
    id: controls
    attributes:
      label: Non-vacuity and mutation controls
      description: Explain the known-bad mutation the oracle detects and the valid boundary it still accepts.
    validations:
      required: true

  - type: textarea
    id: semantic-neighborhood
    attributes:
      label: Semantic neighborhood and hot-path risk
      description: Before marking this upstream-ready, list owning abstractions, modeled implementers, sibling methods or overloads, exact error and effect-order contracts, and JVM/reference-runtime differential coverage. If a shared hot path changes, include caller frequency and stable base/candidate timing; otherwise give an evidence-backed not-applicable reason. This may remain pending while status is Observed.

  - type: textarea
    id: fix
    attributes:
      label: Fix commits
      description: List exact commits. Addressing commits should include `Refs` or `Fixes chucklehead-dev/jolt-aspect-packs#N`.

  - type: textarea
    id: validation
    attributes:
      label: Validation and review
      description: Record exact commands, totals, platforms, and independent review outcome.

  - type: textarea
    id: upstream-provenance
    attributes:
      label: Upstream provenance
      description: As they become available, record the reviewed submitted head, maintainer final head and substantive changes, GitHub merge SHA, and current-main commit verified by ancestry or patch identity. Distinguish mechanical sync merges.

  - type: textarea
    id: gaps
    attributes:
      label: Remaining gaps and upstream disposition
      description: State what is still unproved, the intended upstream repository, whether upstream work is authorized, and propagation-closure results for stale limitations, error text, divergence reasons, versions, issue references, and changelog placement.
    validations:
      required: true
